<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04071a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="asai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Прокачка asai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: phone-first night-watch HUD. Live sky header follows real time, one scrolling column, fixed five-tab bar. Single dark theme by design. */
:root{
  --bg:#0a0f1d; --panel:#111a2c; --panel2:#17223a; --line:#24314b; --ink:#e9eef7; --mute:#8d9ab3;
  --gold:#f2c14e; --gold-d:#a57b14; --gold-ink:#2a1d00; --shadow:#060a14; --track:#1e2a42;
  --sleep:#6aa8ff; --body:#f09a4a; --skin:#c993f0; --will:#4fd1a5; --duo:#ff8fa3;
  --good:#5fd08f; --bad:#ef6b5e;
  --f-d:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
html{background:var(--bg)}
body{margin:0;padding-inline:16px;padding-block:0 112px;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);-webkit-text-size-adjust:100%}
#app{max-width:480px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0;font:600 12px/1.2 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
ol{margin:0;padding-left:20px}
a{color:var(--gold)}
.mute{color:var(--mute)}
.small{font-size:13px}
.tn{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:14px 0}
.boot{padding-block:120px;text-align:center;font:500 14px var(--f-d);letter-spacing:.08em;color:var(--mute)}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.split>*{min-width:0}

/* sky */
.sky{position:relative;margin-inline:-16px;padding:calc(58px + env(safe-area-inset-top,0px)) 16px 34px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:9px;color:#fff;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 100%);text-shadow:0 1px 2px rgba(0,0,0,.45)}
.sky.night{--s1:#04071a;--s2:#18204d;--st:1}
.sky.wind{--s1:#090e2c;--s2:#3b2b5e;--st:.75}
.sky.evening{--s1:#272150;--s2:#b8603c;--st:.15}
.sky.day{--s1:#1b4b80;--s2:#5f95c6;--st:0}
.sky.morning{--s1:#24315c;--s2:#cf8460;--st:.3}
.sky::before{content:"";position:absolute;inset:0;z-index:-3;opacity:var(--st);background-image:
  radial-gradient(1.5px 1.5px at 8% 18%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 19% 44%,#fff 50%,transparent 55%),
  radial-gradient(1.2px 1.2px at 31% 12%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 43% 36%,#fff 50%,transparent 55%),
  radial-gradient(1.6px 1.6px at 57% 20%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 66% 50%,#fff 50%,transparent 55%),
  radial-gradient(1.2px 1.2px at 78% 14%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 88% 40%,#fff 50%,transparent 55%),
  radial-gradient(1.4px 1.4px at 95% 8%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 50% 6%,#fff 50%,transparent 55%)}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;z-index:-1;background:var(--bg);clip-path:polygon(0 72%,7% 48%,15% 66%,25% 30%,35% 58%,47% 24%,57% 52%,69% 34%,81% 60%,91% 36%,100% 54%,100% 100%,0 100%)}
.aur{position:absolute;inset:-20% -10% 30%;z-index:-2;opacity:.55;filter:blur(18px);background:
  linear-gradient(100deg,transparent 10%,rgba(79,209,165,.55) 25%,transparent 40%,rgba(106,168,255,.45) 55%,transparent 70%,rgba(201,147,240,.4) 82%,transparent 95%);
  animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-8%) skewY(-4deg)}to{transform:translateX(8%) skewY(3deg)}}
.orb{position:absolute;z-index:-1;border-radius:50%;transform:translate(-50%,-50%)}
.orb.sun{width:40px;height:40px;background:radial-gradient(circle,#fff7da 0 32%,#ffd36b 55%,rgba(255,200,90,0) 72%)}
.orb.moon{width:24px;height:24px;background:#ece8d6;box-shadow:inset -7px -3px 0 0 #b8b199,0 0 18px rgba(236,232,214,.45)}
.hud-row{display:flex;align-items:center;gap:12px}
.emblem{width:52px;height:52px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.hud-id{flex:1;min-width:0}
.hud-name{font:700 19px/1.1 var(--f-d);letter-spacing:.02em}
.hud-rank{font-size:12px;opacity:.88}
.lvl{display:flex;align-items:baseline;gap:5px;font-family:var(--f-d)}
.lvl span{font-size:11px;opacity:.8}
.lvl b{font-size:30px;line-height:1;color:var(--gold)}
.hud-chips{display:flex;gap:6px;flex-wrap:wrap}
.hchip{font:600 11px var(--f-b);padding:3px 8px;border-radius:20px;background:rgba(4,7,18,.45);text-shadow:none}
.hchip.hot{background:var(--gold);color:var(--gold-ink)}
.phase{font-size:13px;font-weight:500}
.xpbar{height:9px;background:rgba(4,7,18,.5);border-radius:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .6s ease}
.xp-meta{display:flex;justify-content:space-between;font-size:12px;opacity:.85}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.focus{border-color:var(--gold);background:linear-gradient(180deg,#1a2133 0%,var(--panel) 70%)}
.panel.slim{padding:10px 14px}
.panel.twist{border-color:var(--skin);background:linear-gradient(180deg,#22183a 0%,var(--panel) 75%)}
.panel.duo{border-color:var(--duo);background:linear-gradient(180deg,#2c1825 0%,var(--panel) 75%)}
.panel.boss{border-color:#3a2a4a;background:radial-gradient(120% 80% at 50% 0%,#24183a 0%,var(--panel) 70%)}
.title{font:700 18px/1.2 var(--f-d)}
.tag{font:600 11px var(--f-d);color:var(--gold-ink);background:var(--gold);padding:3px 8px;border-radius:5px;white-space:nowrap}
.tag.twist{background:var(--skin);color:#1d0f2b}
.tag.duo{background:var(--duo);color:#2b0c14}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{font-size:14px}
.lbl{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.lore{font-size:14px;line-height:1.5;color:#cbd4e4;font-style:italic}

/* master voice */
.master{display:flex;gap:12px;align-items:flex-start}
.owl{width:44px;height:44px;flex:none}
.master .say-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.master .who{font:600 11px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}

/* stats */
.stat{display:flex;flex-direction:column;gap:5px}
.stat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat-n{font:600 11px var(--f-d);letter-spacing:.06em}
.stat-v{font:700 17px/1 var(--f-d);font-variant-numeric:tabular-nums}
.stat-d{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg i{height:9px;background:var(--track);border-radius:2px}
.seg i.on{background:var(--c)}

/* boss */
.boss-top{display:flex;gap:14px;align-items:center}
.boss-art{width:76px;height:76px;flex:none;transition:transform .3s}
.boss-art.dead{filter:grayscale(1) brightness(.6);transform:rotate(-12deg) scale(.92)}
.boss-art.hit{animation:hit .5s ease-out}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-3px)}100%{transform:none}}
.hp{display:grid;gap:4px}
.hp i{height:12px;border-radius:3px;background:var(--bad)}
.hp i.lost{background:var(--track)}
.pips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.pip i{width:100%;height:22px;border-radius:5px;background:var(--track);border:2px solid transparent}
.pip.ok i{background:var(--good)}
.pip.miss i{background:#33222a;border-color:var(--bad)}
.pip.today i{border-color:var(--gold)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px}

/* buttons */
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:14px 16px;font:700 13px/1.2 var(--f-d);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--gold-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn[disabled]{background:#2f3a50;color:#7c89a1;box-shadow:0 4px 0 #1c2436;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.small{padding:10px 12px;font-size:11px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px;font-size:13px;align-self:center}
.sq{width:46px;height:46px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:700 20px/1 var(--f-d);box-shadow:0 3px 0 var(--shadow)}
.sq:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.sq[disabled]{opacity:.35;cursor:default}
.sq.sm{width:48px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow);font-size:14px;min-height:44px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.chip.on{border-color:var(--gold);background:#2a2817;color:var(--gold)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid5 .chip{padding:10px 0;text-align:center;font:600 16px var(--f-d)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts .chip{text-align:center;padding-inline:4px}
.opts2{grid-template-columns:1fr 1fr}
.opts5{grid-template-columns:repeat(5,1fr)}

/* steppers */
.tstep{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.tstep-r{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:4px;width:100%}
.tstep .sq{width:36px;height:44px;font-size:18px}
.tv{text-align:center;font:700 24px/1 var(--f-d);font-variant-numeric:tabular-nums}
.tstep .tv{font-size:clamp(14px,4.3vw,20px);letter-spacing:-.02em;white-space:nowrap}
.nstep{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nstep .nl{font-size:14px}
.nstep .tstep-r{width:auto;grid-template-columns:46px 52px 46px;gap:6px}
.nstep .sq{width:46px}
.stime{display:flex;flex-direction:column;gap:6px;align-items:center}
.stime-r{display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px 48px;gap:6px;align-items:center;width:100%}
.stime .tv{font-size:clamp(16px,5vw,22px)}
.stime .tv.past{color:var(--gold)}

/* quests */
.quest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 3px 0 var(--shadow)}
.quest:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.chk{width:26px;height:26px;flex:none;border:2px solid var(--mute);border-radius:6px;position:relative}
.quest.done{border-color:var(--good)}
.quest.done .chk{background:var(--good);border-color:var(--good)}
.quest.done .chk::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg)}
.quest.done .qt{color:var(--mute);text-decoration:line-through}
.qt{flex:1;min-width:0}
.qt b.st{display:block;font-weight:600}
.qt .sd{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.badge-n{display:block;font-size:12px;color:var(--skin);margin-top:3px}
.qxp{font:600 11px var(--f-d);color:var(--gold);white-space:nowrap}

/* quick row, water */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--shadow)}
.qbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.qbtn b{font:700 22px/1 var(--f-d);font-variant-numeric:tabular-nums}
.qbtn span{font-size:12px;color:var(--mute)}
.qbtn.w b{color:var(--sleep)}.qbtn.s b{color:var(--body)}.qbtn.c b{color:var(--will)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.gl{height:30px;border:2px solid var(--line);border-top:0;border-radius:0 0 6px 6px;position:relative;overflow:hidden}
.gl.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--sleep);opacity:.85}

/* buffs */
.buff{display:flex;gap:10px;align-items:flex-start}
.buff i{flex:none;font:700 10px var(--f-d);padding:4px 7px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase;font-style:normal;margin-top:1px}
.buff.good i{background:#173a2a;color:var(--good)}
.buff.bad i{background:#3a1d22;color:var(--bad)}
.buff.gold i{background:#3a3117;color:var(--gold)}
.buff p{font-size:14px;min-width:0}
.plan{display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan li::marker{color:var(--gold);font-weight:600}

/* path */
.mile{display:flex;align-items:center;gap:10px;font-size:14px}
.mile .chk{width:20px;height:20px;border-radius:5px}
.mile.done .chk{background:var(--good);border-color:var(--good)}
.mile.done .chk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.mile span.t{flex:1;min-width:0}
.mile.done span.t{color:var(--mute)}
.chap{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-block:6px;border-top:1px solid var(--line)}
.chap:first-child{border-top:0}
.retro{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr;gap:6px 10px;font-size:14px;align-items:baseline}
.retro .h{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.retro b{font:600 15px var(--f-b);font-variant-numeric:tabular-nums}
.up{color:var(--good);font-size:12px}.down{color:var(--bad);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font:9px var(--f-b)}
.chart .ref{stroke:var(--gold);stroke-width:1.2;stroke-dasharray:4 3}
.chart .ref-t{fill:var(--gold);font:600 9px var(--f-b)}
.chart .b-good{fill:var(--sleep)}
.chart .b-late{fill:#6b4b63}
.chart .b-smoke{fill:var(--body)}
.chart .b-zero{fill:var(--good)}
.chart .nil{fill:var(--track)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--track);max-width:100%}
.heat i.v{background:rgba(242,193,78,var(--a))}
.heat i.now{outline:2px solid var(--ink);outline-offset:-2px}
.heat b{font:500 10px var(--f-b);color:var(--mute);text-align:center}

/* smoke */
.big{font:700 54px/1 var(--f-d);text-align:center;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--mute)}
.clean{font:700 30px/1.1 var(--f-d);text-align:center;color:var(--will);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--track);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--body)}
.timer{font:700 56px/1 var(--f-d);text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.cd{font:700 34px/1.1 var(--f-d);color:var(--gold);font-variant-numeric:tabular-nums}
.tr{display:grid;grid-template-columns:86px 1fr 24px;align-items:center;gap:8px;font-size:13px}
.tr .bar{height:8px}
.log{display:flex;flex-wrap:wrap;gap:6px}
.log span{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.log .logx{font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:36px}
.log .logx b{color:var(--bad);margin-left:4px}
.dates{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
.dates div{font:600 13px var(--f-d);text-align:center}
.oath{border:1px dashed var(--will);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* forms */
.ask{display:flex;gap:8px}
.ask .txt{flex:1;min-width:0}
.txt{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
.fld .txt{min-width:0;max-width:100%;display:block}
input[type=date].txt{-webkit-appearance:none;appearance:none;text-align:left;min-height:48px}
input[type=date].txt::-webkit-date-and-time-value{text-align:left}
select.txt{-webkit-appearance:none;appearance:none}

/* v6: structure, categories, feedback */
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 2px 0;font:700 15px var(--f-d);letter-spacing:.01em}
.sect-a{font:500 12px var(--f-b);color:var(--mute)}
.gold{color:var(--gold)}
.prog{font:600 12px var(--f-b);color:var(--gold)}
.qbar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:-4px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd987);border-radius:3px;transition:width .5s ease}
.qrow{display:flex;flex-direction:column;gap:6px}
.cat-q{--cc:var(--gold)}.cat-s{--cc:var(--skin)}.cat-d{--cc:var(--duo)}.cat-w{--cc:var(--body)}
.qrow .quest{border-left:4px solid var(--cc)}
.qrow .quest.done{border-color:var(--line);border-left-color:var(--good)}
.qtag{display:block;font:600 10px/1.3 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--cc);margin-bottom:2px}
.quest.done .qt b.st{color:var(--mute);text-decoration:line-through;font-weight:500}
.quest.done .qt .sd,.quest.done .badge-n{display:none}
.quest.just .chk{animation:chk .35s ease-out}
.quest.just{animation:glow .7s ease-out}
@keyframes chk{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(95,208,143,.6)}100%{box-shadow:0 0 0 12px rgba(95,208,143,0)}}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.donebox>summary,.plandet>summary{font-size:13px;color:var(--mute);padding:4px 2px;display:flex;align-items:center;gap:6px}
.plandet>summary{color:var(--body);padding:0 4px}
.donebox>summary::before,.plandet>summary::before{content:"›";display:inline-block;transition:transform .2s;font-weight:700}
.donebox[open]>summary::before,.plandet[open]>summary::before{transform:rotate(90deg)}
.donebox>.qrow{margin-top:8px}
.plandet>ol,.plandet>p{margin-top:8px;padding-left:24px}
.plandet>p{padding-left:4px}
details.panel{display:block}
.det>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.det>summary h2::before{content:"›";display:inline-block;margin-right:8px;transition:transform .2s;color:var(--gold)}
.det[open]>summary h2::before{transform:rotate(90deg)}
.det .inner{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mcard{border-color:#3a3463;background:linear-gradient(160deg,#1c1a3a 0%,var(--panel) 60%)}
.reply{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.mini-opts .chip{min-height:36px;padding:6px 8px;font-size:13px}
.hero{cursor:pointer;text-align:left}
.hero:active{transform:translateY(1px)}
.hero-boss{display:flex;gap:12px;align-items:center}
.boss-mini{width:48px;height:48px;flex:none}
.boss-mini.dead{filter:grayscale(1) brightness(.6)}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hb .hp i{height:8px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mini{display:grid;grid-template-columns:38px 1fr 24px;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.mini b{color:var(--ink);font:600 13px var(--f-b);text-align:right}
.mbar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{font:600 11px var(--f-b);padding:4px 9px;border-radius:12px}
.bchip.good{background:#173a2a;color:var(--good)}.bchip.bad{background:#3a1d22;color:var(--bad)}.bchip.gold{background:#3a3117;color:var(--gold)}
.more{font-size:12px;color:var(--gold);align-self:flex-end}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px}
.segb{background:none;border:0;border-radius:9px;padding:10px 0;font:600 13px var(--f-b);color:var(--mute)}
.segb.on{background:var(--panel2);color:var(--gold);box-shadow:0 2px 0 var(--shadow)}
.smoke-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.smoke-top .clean{text-align:left;font-size:26px}
.today-n{text-align:right}
.today-n b{font:700 34px/1 var(--f-d);color:var(--body)}
.today-n small{font-size:14px;color:var(--mute)}
.fxp{position:fixed;z-index:11;pointer-events:none;font:700 17px var(--f-d);color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.7);transform:translate(-50%,0);animation:fxp .95s ease-out forwards}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.xpbar.flash i{box-shadow:0 0 14px 2px var(--gold)}
@media (prefers-reduced-motion:reduce){.quest.just,.quest.just .chk,.fxp{animation:none}.qbar i{transition:none}}

/* tab bar, toast, modal */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;border-radius:10px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font:500 11px var(--f-b)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;transform:translate(-50%,8px);max-width:calc(100% - 32px);background:#05080f;border:1px solid var(--gold);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(3,5,12,.8)}
.modal-card{position:relative;overflow:hidden;width:100%;max-width:340px;background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .35s ease-out}
.modal-card .kicker{font:600 11px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.modal-card b.mt{font:700 24px/1.15 var(--f-d)}
.modal-card p{color:#cbd4e4;font-size:14px}
.modal-card .btn{align-self:stretch;margin-top:6px}
.modal-card .art{width:96px;height:96px}
.modal-card .dots{display:flex;gap:6px}
.modal-card .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.modal-card .dots i.on{background:var(--gold)}
.rays{position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(rgba(242,193,78,.10) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn,.toast,.xpbar i{transition:none}.modal-card,.rays,.aur,.boss-art.hit{animation:none}}
</style>

<body>
<div id="app"><div class="boot">Загружаю героя…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script>
(function(){
'use strict';
var LV_BASE=600,LV_STEP=150,START='2026-10-13',DAY_SHIFT=5*3600e3;
var TRIG=['После еды','Дорога','Перерыв','Стресс','Скука','Другое'];
var SWAP={'После еды':'Встать из-за стола сразу, стакан воды, жвачка или почистить зубы.','Дорога':'Айкос не класть в карман, занять руки, включить подкаст.','Перерыв':'Чай или короткая прогулка вместо курилки.','Стресс':'Дыхание: вдох на 4 счёта, выдох на 6, пять кругов, потом на воздух без стика.','Скука':'10 приседаний или написать кому-нибудь пару строк.','Тяга':'Таймер на 10 минут и стакан воды.','Другое':'Отложить на 10 минут и проверить, хочется ли ещё.'};
var TIPS=['Стакан холодной воды маленькими глотками','Выйди пройтись на 3 минуты','10 приседаний прямо сейчас','Жвачка или леденец без сахара','Вдох на 4 счёта, выдох на 6, пять кругов','Напиши кому-нибудь пару строк','Умойся холодной водой'];
var WT=['Турник','Брусья','Отжимания','Резинки','Бег','Ходьба','Уличный зал'];
var POOL=['Телефон убран за 30 минут до сна','10 минут прогулки после обеда','Стакан воды вместо стика после еды','Собрать контейнер с обедом на завтра','Проветрить спальню перед сном','Без кофе и энергетиков после 16:00','Один перерыв на работе без стика','Рыба или яйца в одном из приёмов пищи','Растяжка 5 минут перед сном','Написать или позвонить близкому человеку','10 минут на улице при дневном свете','Убрать айкос и стики из поля зрения'];
var DUO=['Ужин вдвоём без телефонов на столе','Прогулка вдвоём 20 минут после ужина','Приготовить ужин вместе: тебе рыба, ей мясо, одна духовка','Вечер без экранов после 22:30: разговор, настолка или книга','Спросить друг друга: что сегодня было лучшим?','Завтрак вместе, даже если всего 10 минут','Вместе собрать обеды на завтра','Выбрать новый рецепт на выходные вдвоём','Растяжка вдвоём 10 минут перед сном','Сказать ей одну конкретную вещь, за которую ты благодарен сегодня','Вместе составить список покупок на неделю'];
var DEFM={name:'asai',xday:'2026-10-19',baseline:10,packPrice:0,flags:{},sky:'classic'};
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var PHASE={morning:'Утро',day:'День',evening:'Вечер',wind:'Подготовка ко сну',night:'Ночь'};
var ICONS={
  now:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  log:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9a4 4 0 0 1 4 4v12H10a4 4 0 0 1-4-4z"/><path d="M10 9h5M10 13h5"/></svg>',
  path:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4 2.5 4H5"/></svg>',
  smoke:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2.5-5 0 2 .8 3 2 3.2C11 8.5 11 5.5 12 3z"/></svg>',
  master:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9c0-3 3-5 7-5s7 2 7 5v5c0 4-3 6-7 6s-7-2-7-6z"/><circle cx="9.5" cy="10.5" r="1.6"/><circle cx="14.5" cy="10.5" r="1.6"/><path d="M11 14l1 1.2 1-1.2"/></svg>'
};
var TABS=[['now','Сейчас'],['log','Журнал'],['path','Путь'],['smoke','Дым'],['master','Мастер']];
var BOSS=[
  {key:'sleep',title:'Хранитель сна',need:[5,6,6],text:function(n){return 'Отбой не позже 23:30 в '+n+' из 7 ночей'},hit:function(d){return !!(d.morning&&d.bedRel<=330)},lore:'Он кормится твоими поздними отбоями и листанием ленты в полночь.'},
  {key:'smoke',title:'Дымный змей',need:[4,5,7],text:function(n){return n+' чистых дней без стиков из 7'},hit:function(d){return !!(d.closed&&d.oath&&!(d.sticks||[]).length)},lore:'Обвивается вокруг перерывов и дороги. Каждый чистый день отрубает ему кольцо.'},
  {key:'iron',title:'Железный голем',need:[3,3,4],text:function(n){return n+' тренировки за неделю'},hit:function(d){return !!(d.workout&&d.workout.done)},lore:'Неподвижный и тяжёлый. Его не победить словами, только повторами.'},
  {key:'water',title:'Страж источника',need:[5,6,7],text:function(n){return 'Вода от 8 стаканов в '+n+' днях из 7'},hit:function(d){return ((d.food&&d.food.water)||0)>=8}, lore:'Охраняет колодец. Пропускает только тех, кто приходит каждый день.'}
];
var CH=[
  {t:'Пробуждение',lore:'Ты просыпаешься в мире, где ночь длиннее дня, а дым застилает дорогу. Мастер-сова не выдаёт мечей. Сначала разведка: узнай свой сон, свою силу и врага в кармане.',outro:'Разведка окончена. Ты знаешь врага в лицо. Теперь его тропы можно перекрывать.',m:[
    ['m1','Записать первое утро',30,function(a){return a.mornings>=1}],
    ['m2','Пройти тест силы',50,function(a){return !!a.firstTest}],
    ['m3','Записывать стики 5 дней',50,function(a){return a.sticksDays>=5}]]},
  {t:'Дым',lore:'У врага есть имя и расписание: после еды, в дороге, от скуки. В Х-день ты перекрываешь первую тропу. Срыв не конец главы, а начало камбэка.',outro:'Неделя без дыма. Змей ослаб, а у тебя появилось время, деньги и дыхание.',m:[
    ['m4','Первый чистый день',100,function(a){return a.smokeBest>=1}],
    ['m5','3 чистых дня подряд',150,function(a){return a.smokeBest>=3}],
    ['m6','7 чистых дней подряд',300,function(a){return a.smokeBest>=7}]]},
  {t:'Кожа',lore:'Доспех героя это его кожа. Её чинит лекарь, а твоё дело регулярность: утро, вечер, без пропусков.',outro:'Доспех в надёжных руках. Регулярность стала привычкой.',m:[
    ['m7','Записаться к дерматологу',100,function(a,f){return !!f.dermBooked},'dermBooked'],
    ['m8','Сходить на приём',100,function(a,f){return !!f.dermVisited},'dermVisited'],
    ['m9','14 вечеров с уходом',150,function(a){return a.careDays>=14}]]},
  {t:'Железо',lore:'Турник во дворе помнит всех, кто сдался на третьем повторе. Ты будешь возвращаться к нему снова и снова.',outro:'Железо поддалось. Тело стало инструментом, а не обузой.',m:[
    ['m10','10 тренировок',150,function(a){return a.workouts>=10}],
    ['m11','+3 подтягивания к первому тесту',200,function(a){return !!(a.firstTest&&a.lastTest&&a.lastTest.pullups-a.firstTest.pullups>=3)}]]},
  {t:'Ритм',lore:'Последняя глава не про подвиг, а про ритм. Когда отбой в 23:30 перестаёт быть квестом, ты победил.',outro:'Ритм твой. Сезон пройден, но игра продолжается: боссы вернутся сильнее.',m:[
    ['m12','7 ночей подряд с отбоем до 23:30',200,function(a){return a.bedBest>=7}],
    ['m13','Серия 14 дней',300,function(a,f,s){return s.best>=14}]]}
];
var INTRO=[
  ['Добро пожаловать','Ты asai. Твоя жизнь это игра','Сон, еда, тренировки, кожа и отказ от айкоса дают опыт, уровни и трофеи. Каждую неделю приходит новый босс.'],
  ['Как играть','Экран «Сейчас» подскажет ход','Утром запиши сон. Днём вода и квесты. Вечером три тапа и «Закрыть день». Если день меняется, скажи Мастеру, и он перестроит квесты.'],
  ['Главное правило','Честность выгоднее','Записанный срыв приносит опыт и запускает «Камбэк». Серия дней даёт Импульс до +30% ко всему опыту. Сорвёшь серию, и Импульс сгорит.']
];

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function todayISO(){return iso(new Date(Date.now()-DAY_SHIFT))}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function fmtDate(s){var d=parse(s);return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]}
function hhmm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function bedClock(rel){return (rel+1080)%1440}
function sleepMin(d){return ((d.wake-bedClock(d.bedRel))+1440)%1440}
function durTxt(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+' ч '+pad(m%60)+' мин'}
function durShort(m){m=Math.max(0,Math.round(m));return m>=60?Math.floor(m/60)+' ч '+pad(m%60)+' мин':m+' мин'}
function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s){return document.querySelector(s)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function avg(a){return a.reduce(function(x,y){return x+y},0)/a.length}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)}
function plural(n,a,b,c){var m=n%10,k=n%100;return m===1&&k!==11?a:(m>=2&&m<=4&&(k<12||k>14))?b:c}
function fmt1(x){return x.toFixed(1).replace('.',',')}
function fmtMult(m){return m.toFixed(2).replace(/0$/,'').replace('.',',')}
function phase(m){if(m>=300&&m<660)return 'morning';if(m>=660&&m<1080)return 'day';if(m>=1080&&m<1260)return 'evening';if(m>=1260&&m<1410)return 'wind';return 'night'}
function rank(l){return l<3?'Рекрут':l<6?'Странник':l<10?'Страж':l<15?'Ветеран':'Мастер'}
function levelInfo(xp){var l=1,need=LV_BASE;while(xp>=need&&l<99){xp-=need;l++;need=LV_BASE+LV_STEP*(l-1)}return {lvl:l,into:xp,need:need}}
function skey(t){var p=String(t).split(':').map(Number),m=p[0]*60+p[1];return m<300?m+1440:m}
function mkey(m){return m<300?m+1440:m}
function monday(d){return addDays(d,-((parse(d).getDay()+6)%7))}

var S={days:{},meta:clone(DEFM),tab:'now',view:todayISO(),ready:false,craving:null,dm:null,dirty:false,stickT:null,oath:null,sayMode:'event',seen:null,pathTab:'story',open:{},just:null,tap:null,lastToday:null,lastPhase:null,hitAnim:null};
(function(){var p=lsGet('asai.pathtab');if(p==='story'||p==='fight'||p==='stats')S.pathTab=p;var t=lsGet('asai.tab');if(t==='day')t='log';if(t&&TABS.some(function(x){return x[0]===t}))S.tab=t})();

function dayQuests(date){
  var h=hash(date),pool=POOL.slice(),out=[],before=date<S.meta.xday,n=before?2:3;
  for(var i=0;i<n;i++)out.push(pool.splice((h+i*7)%pool.length,1)[0]);
  if(before)out.push('Записывать каждый стик с временем и поводом');
  return out.map(function(t,i){return {id:'q'+(i+1),text:t,done:false}});
}
function duoFor(date,d){if(d&&d.duo&&d.duo.text)return d.duo;return {text:DUO[hash('duo'+date)%DUO.length],done:false}}
function newDay(date){return {date:date,quests:dayQuests(date),sticks:[],cravings:0}}
function ctxDate(){return (S.tab==='log'||S.tab==='master')?S.view:todayISO()}

/* ---------- storage + sync ---------- */
function lsSave(){lsSet('asai.v1',JSON.stringify({days:S.days}))}
var GH=null;try{GH=JSON.parse(lsGet('asai.gh'))}catch(e){}
var DIRTY={},DVER={};try{DIRTY=JSON.parse(lsGet('asai.dirty'))||{}}catch(e){DIRTY={}}
S.metaDirty=lsGet('asai.metaDirty')==='1';
function saveDirty(){lsSet('asai.dirty',JSON.stringify(DIRTY));lsSet('asai.metaDirty',S.metaDirty?'1':'')}
var SY={state:'idle',last:null,err:null,busy:false,pushT:null};
function hasDirty(){return S.metaDirty||Object.keys(DIRTY).length>0}
function markDirty(date,old,cur){
  var ks={};Object.keys(old).concat(Object.keys(cur)).forEach(function(k){if(JSON.stringify(old[k])!==JSON.stringify(cur[k]))ks[k]=1});
  var add=Object.keys(ks);if(!add.length)return;
  var ex=DIRTY[date]||[];add.forEach(function(k){if(ex.indexOf(k)<0)ex.push(k)});
  DIRTY[date]=ex;DVER[date]=(DVER[date]||0)+1;saveDirty();
}
function persist(date,doc,old){markDirty(date,old||{},doc);lsSave();schedulePush()}
function mutate(date,fn,silent,msg){
  var before=silent?null:compute();
  var old=S.days[date]||{},cur=S.days[date]?clone(S.days[date]):newDay(date);
  fn(cur);
  S.days[date]=cur;
  persist(date,cur,old);
  if(silent)return;
  render();
  var after=compute(),dx=after.xp-before.xp,parts=[],bt=before.boss,at=after.boss;
  if(msg)parts.push(msg);
  if(dx>0&&S.tap&&Date.now()-S.tap.t<1500)floatXP('+'+dx+' XP');else if(dx)parts.push((dx>0?'+':'')+dx+' XP');
  if(bt&&at&&at.w===bt.w&&at.ok>bt.ok&&!at.done){S.hitAnim=Date.now();parts.push('удар по боссу, осталось '+(at.need-at.ok));render()}
  if(parts.length)toast(parts.join(' · '));
}
function saveMeta(m){S.meta=m;lsSet('asai.meta',JSON.stringify(m));S.metaDirty=true;saveDirty();schedulePush();render()}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))))}
function ghUrl(p){return 'https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+'/contents/'+p}
function ghErr(st){return st===401?'токен не подходит':st===403?'нет прав на запись':st===404?'репозиторий не найден':'ошибка '+st}
async function ghGet(p){
  var r=await fetch(ghUrl(p),{headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404){var rr=await fetch('https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo),{headers:{Authorization:'Bearer '+GH.token},cache:'no-store'});if(!rr.ok)throw new Error(ghErr(rr.status));return {data:null,sha:null}}
  if(!r.ok)throw new Error(ghErr(r.status));
  var j=await r.json();
  return {data:JSON.parse(b64d(j.content)),sha:j.sha};
}
async function ghPut(p,data,sha,msg){
  var body={message:msg,content:b64e(JSON.stringify(data,null,1))};if(sha)body.sha=sha;
  var r=await fetch(ghUrl(p),{method:'PUT',headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false;
  if(!r.ok)throw new Error(ghErr(r.status));

}
function monthOf(d){return d.slice(0,7)}
function mergeDay(remote,local,keys){var o=Object.assign({},remote||{});keys.forEach(function(k){if(local&&Object.prototype.hasOwnProperty.call(local,k))o[k]=local[k];else delete o[k]});return o}
function setSync(st,e){SY.state=st;SY.err=e?String(e.message||e):null;if(st==='ok')SY.last=Date.now();if(S.ready&&S.tab==='master')safeRender()}
function applyMeta(m){m=clone(m);delete m.boss;S.meta=Object.assign(clone(DEFM),m);S.meta.flags=Object.assign({},m.flags||{})}
async function pull(){
  if(!GH||SY.busy)return;
  SY.busy=true;setSync('sync');
  try{
    var t=todayISO(),months=[monthOf(addDays(t.slice(0,8)+'01',-1)),monthOf(t)];
    Object.keys(DIRTY).forEach(function(d){if(months.indexOf(monthOf(d))<0)months.push(monthOf(d))});
    var mr=await ghGet('meta.json');
    if(mr.data&&!S.metaDirty){applyMeta(mr.data);lsSet('asai.meta',JSON.stringify(S.meta))}
    for(var i=0;i<months.length;i++){
      var r=await ghGet('days/'+months[i]+'.json');
      if(r.data)Object.keys(r.data).forEach(function(k){var ks=DIRTY[k];S.days[k]=ks&&ks.length?mergeDay(r.data[k],S.days[k],ks):r.data[k]});
    }

async function push(){
  if(!GH||SY.busy||!hasDirty())return;
  SY.busy=true;setSync('sync');
  try{
    if(S.metaDirty){
      for(var a=0;a<3;a++){var mr=await ghGet('meta.json');if(await ghPut('meta.json',S.meta,mr.sha,'asai: настройки')){S.metaDirty=false;break}}
      saveDirty();
    }
    var byM={};Object.keys(DIRTY).forEach(function(d){(byM[monthOf(d)]=byM[monthOf(d)]||[]).push(d)});
    var ms=Object.keys(byM);
    for(var i=0;i<ms.length;i++){
      var path='days/'+ms[i]+'.json',days=byM[ms[i]];
      for(var att=0;att<3;att++){
        var sent={};days.forEach(function(d){sent[d]=DVER[d]||0});
        var r=await ghGet(path),data=r.data||{};
        days.forEach(function(d){if(DIRTY[d])data[d]=mergeDay(data[d],S.days[d],DIRTY[d])});
        if(await ghPut(path,data,r.sha,'asai: '+days.join(', '))){
          days.forEach(function(d){if((DVER[d]||0)===sent[d]){delete DIRTY[d];S.days[d]=data[d]}});
          break;
        }
      }
    }
    saveDirty();lsSave();SY.busy=false;setSync('ok');
  }catch(e){SY.busy=false;setSync('err',e);schedulePush(30000);return}
  if(hasDirty())schedulePush(1500);
}
function schedulePush(ms){if(!GH)return;clearTimeout(SY.pushT);SY.pushT=setTimeout(function(){push()},ms==null?1500:ms)}

function comeback(d,key,today){
  var st=(d.sticks||[]).slice().sort(function(a,b){return skey(a.t)-skey(b.t)});
  if(!st.length)return null;
  var k1=skey(st[0].t),until=k1+180;
  if(st.length>1&&skey(st[1].t)<=until)return {state:'fail',from:st[0].t,until:hhmm(until)};
  if(key<today||mkey(nowMin())>=until)return {state:'ok',from:st[0].t,until:hhmm(until)};
  return {state:'active',from:st[0].t,until:hhmm(until),left:until-mkey(nowMin())};
}
function dayXP(d,key,meta,mult,today){

  if(d.duo&&d.duo.done)add('Квест на двоих',40);
  if(d.workout&&d.workout.done)add('Тренировка',40);

  if(f.nomeat)add('Без красного мяса',10);
  if(f.ok===2)add('Ел нормально',10);
  if(sk.am)add('Уход за кожей утром',10);
  if(sk.pm)add('Уход за кожей вечером',10);
  if(d.joy&&String(d.joy).trim().length>=3)add('Хорошее за день',10);
  if(f.ok!=null&&sk.state&&d.stress!=null)add('Вечерний чек',15);

}
function bossWeek(w,today){

function weekSum(from,C,lim){

function dayProgress(date,d){
  var it=[],f=d.food||{},ml=f.meals||{},sk=d.skin||{};
  it.push(!!d.morning);
  (d.quests||[]).forEach(function(q){it.push(!!q.done)});
  (d.side||[]).forEach(function(s){it.push(!!s.done)});
  it.push(!!duoFor(date,d).done);
  it.push(!!(d.workout&&d.workout.done));
  it.push((f.water||0)>=8);
  it.push(!!(ml.b&&ml.l&&ml.d));
  it.push(!!sk.am);it.push(!!sk.pm);
  it.push(f.ok!=null&&!!sk.state&&d.stress!=null);

  return {done:done,total:it.length,pct:Math.round(done/it.length*100)};

function questLog(date,d,C,title){
  var rows=[],p=planFor(date,C.agg),w=d.workout||{},u=duoFor(date,d);

function celebrate(C){
  if(modalOpen())return;
  var lv=C.lv.lvl,done=C.miles.filter(function(m){return m.done}).map(function(m){return m.id});
  var chDone=CH.map(function(_,i){return C.miles.filter(function(m){return m.ch===i}).every(function(m){return m.done})?i:-1}).filter(function(i){return i>=0});
  var bDone=C.bosses.filter(function(b){return b.done}).map(function(b){return b.w});
  if(!S.seen){
    var s=null;try{s=JSON.parse(lsGet('asai.seen'))}catch(e){}
    S.seen=s&&typeof s==='object'?s:{lvl:lv,miles:done,ch:chDone,boss:bDone};
    lsSet('asai.seen',JSON.stringify(S.seen));
  }
  var sn=S.seen,shown=null;

  var fc=chDone.filter(function(i){return (sn.ch||[]).indexOf(i)<0});
  var fm=done.filter(function(id){return (sn.miles||[]).indexOf(id)<0});

  else if(lv>sn.lvl)shown={kicker:'Новый уровень',title:'Уровень '+lv,sub:'Звание: '+rank(lv)+'. '+(lv===3||lv===6||lv===10||lv===15?'Твой знак эволюционировал. ':'')+(lv===4?'Открыто северное сияние: включи его в настройках Мастера. ':'')+'До следующего уровня '+C.lv.need+' XP.',art:emblem(lv,(C.meta.name||'a').charAt(0).toUpperCase()).replace('class="emblem"','class="art"')};
  else if(fc.length)shown={kicker:'Глава пройдена',title:CH[fc[0]].t,sub:CH[fc[0]].outro,art:owl('art')};
  else if(fm.length){var m=C.miles.filter(function(x){return x.id===fm[0]})[0];shown={kicker:'Веха пройдена',title:m.t,sub:'+'+m.xp+' XP · глава «'+CH[m.ch].t+'»'}}
  sn.lvl=Math.max(Math.min(sn.lvl,lv),lv);sn.miles=(sn.miles||[]).concat(fm);sn.ch=(sn.ch||[]).concat(fc);sn.boss=(sn.boss||[]).concat(fb);
  lsSet('asai.seen',JSON.stringify(sn));

function logStick(trig){

  var first=today>=S.meta.xday&&!((S.days[today]||{}).sticks||[]).length;
  mutate(today,function(d){d.sticks=d.sticks||[];d.sticks.push({t:t,trig:trig});d.sticks.sort(function(a,b){return skey(a.t)-skey(b.t)})},false,'Записано '+t+' · '+trig);
  if(first)setTimeout(function(){toast('Честно. Камбэк начат: 3 часа без стика, и +20 XP')},2700);
}
function food(d){d.food=d.food||{};return d.food}
function act(a,el){
  var v=el.dataset.v,dd=Number(el.dataset.d),k=el.dataset.k,date=el.dataset.date||ctxDate(),today=todayISO();
  S.just={k:a+':'+(v==null?'':v),t:Date.now()};
  if(a==='pathtab'){S.pathTab=v;lsSet('asai.pathtab',v);render();return}
  if(a==='tab'){S.tab=v;S.stickT=null;S.oath=null;lsSet('asai.tab',v);if(v==='now')S.view=today;if(el.dataset.date){S.view=el.dataset.date;S.dm=null}render();window.scrollTo(0,0)}
  else if(a==='prev'){S.view=addDays(S.view,-1);S.dm=null;S.oath=null;render()}
  else if(a==='next'){if(S.view<today){S.view=addDays(S.view,1);S.dm=null;S.oath=null;render()}}
  else if(a==='bed'){var m=draft(date);m.bedRel=clamp(m.bedRel+dd,0,720);render()}
  else if(a==='wake'){var w=draft(date);w.wake=(w.wake+dd+1440)%1440;render()}
  else if(a==='mood'){draft(date).mood=Number(v);render()}
  else if(a==='morning'){var m2=draft(date);if(m2.mood==null)return;mutate(date,function(d){d.morning=true;d.bedRel=m2.bedRel;d.wake=m2.wake;d.mood=m2.mood},false,'Утро записано')}
  else if(a==='quest'){mutate(date,function(d){var q=d.quests[Number(v)];if(q)q.done=!q.done})}
  else if(a==='duo'){mutate(date,function(d){var u=duoFor(date,d);d.duo={text:u.text,done:!u.done}},false)}
  else if(a==='wdone'){mutate(date,function(d){d.workout=d.workout||{types:[]};d.workout.done=!d.workout.done})}
  else if(a==='wtype'){mutate(date,function(d){d.workout=d.workout||{types:[]};var ty=d.workout.types=d.workout.types||[],x=ty.indexOf(v);if(x>=0)ty.splice(x,1);else ty.push(v)})}
  else if(a==='wnum'){mutate(date,function(d){d.workout=d.workout||{types:[]};d.workout[k]=clamp((d.workout[k]||0)+dd,0,200)})}
  else if(a==='water'){mutate(date,function(d){var f=food(d);f.water=clamp((f.water||0)+dd,0,20)},false,dd>0?'Стакан воды':'')}
  else if(a==='meal'){mutate(date,function(d){var f=food(d);f.meals=f.meals||{};f.meals[v]=!f.meals[v]})}
  else if(a==='nomeat'){mutate(date,function(d){var f=food(d);f.nomeat=!f.nomeat})}
  else if(a==='foodok'){mutate(date,function(d){food(d).ok=Number(v)})}
  else if(a==='skin'){mutate(date,function(d){d.skin=d.skin||{};d.skin[v]=!d.skin[v]})}
  else if(a==='skinstate'){mutate(date,function(d){d.skin=d.skin||{};d.skin.state=Number(v)})}
  else if(a==='stress'){mutate(date,function(d){d.stress=Number(v)})}
  else if(a==='stick'){logStick(v)}
  else if(a==='stime'){var nk=mkey(nowMin()),kk=mkey(S.stickT!=null?S.stickT:nowMin())+dd;kk=clamp(kk,300,nk);S.stickT=kk>=nk?null:kk%1440;render()}
  else if(a==='stimenow'){S.stickT=null;render()}
  else if(a==='delstick'){var di=Number(v),ds=S.days[today]&&S.days[today].sticks&&S.days[today].sticks[di];if(!ds)return;mutate(today,function(d){d.sticks.splice(di,1)},false,'Удалено '+ds.t)}
  else if(a==='cstart'){startCraving();render()}
  else if(a==='cravego'){startCraving();S.tab='smoke';render();window.scrollTo(0,0)}
  else if(a==='ccancel'){endCraving();render()}
  else if(a==='cwin'){endCraving();mutate(today,function(d){d.cravings=(d.cravings||0)+1},false,'Выдержал')}
  else if(a==='clost'){endCraving();logStick('Тяга')}
  else if(a==='closeday'){
    var cd=S.days[date]||newDay(date);
    if(date>=S.meta.xday&&!(cd.sticks||[]).length){S.oath=date;render();return}
    mutate(date,function(d){d.closed=true;d.closedAt=Date.now()},false,'День закрыт');
  }
  else if(a==='oathyes'){S.oath=null;mutate(date,function(d){d.closed=true;d.oath=true;d.closedAt=Date.now()},false,'Чистый день')}
  else if(a==='oathno'){S.oath=null;S.tab='smoke';render();window.scrollTo(0,0)}
  else if(a==='reopen'){mutate(date,function(d){d.closed=false;delete d.oath})}

  else if(a==='flag'){var nm=clone(S.meta);nm.flags=nm.flags||{};nm.flags[v]=true;saveMeta(nm)}
  else if(a==='saymode'){S.sayMode=v;render()}
  else if(a==='saysend'){var si2=document.getElementById('say-in');if(si2){var tx=si2.value;si2.value='';say(tx)}}
  else if(a==='intro'){showIntro(0)}

    var nm2=clone(S.meta),gv=function(id){return (document.getElementById(id)||{}).value};
    var nv=gv('set-name'),xv=gv('set-xday'),bv=Number(gv('set-base')),pv=Number(gv('set-price')),sv=gv('set-sky');

    nm2.packPrice=pv>0?Math.round(pv):0;
    if(sv==='aurora'||sv==='classic')nm2.sky=sv;
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    saveMeta(nm2);toast('Настройки сохранены');
  }
  else if(a==='ghsave'){
    var go=((document.getElementById('gh-owner')||{}).value||'').trim(),gr=((document.getElementById('gh-repo')||{}).value||'').trim(),gt=((document.getElementById('gh-token')||{}).value||'').trim();

  }
  else if(a==='ghsync'){push().then(pull)}
  else if(a==='ghoff'){GH=null;try{localStorage.removeItem('asai.gh')}catch(e){}render()}
}
